name: apply-v9-pet-ux
on:
  push:
    branches:
      - feat/pet-ux-polish-v9
    paths:
      - scripts/apply_v9_pet_ux.js
      - scripts/fix_apply_v9_script.js
      - tests/v8_motion_toggle_runtime_smoke.js
      - .github/workflows/apply-v9-pet-ux.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pet-ux-polish-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair patch matcher
        run: node scripts/fix_apply_v9_script.js
      - name: Apply V9 UX patch
        run: node scripts/apply_v9_pet_ux.js
      - name: Syntax checks
        run: |
          node --check app.js
          node --check sw.js
      - name: Regression tests
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/v7_motion_expression_smoke.js
          node tests/v8_motion_toggle_runtime_smoke.js
          node tests/v9_pet_ux_smoke.js
          node tests/brand_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
      - name: Commit V9 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html sw.js tests/v5_requirements_smoke.js tests/v6_requirements_smoke.js tests/v8_motion_toggle_runtime_smoke.js tests/v9_pet_ux_smoke.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish pet animation and simplify adult access"
            git push origin HEAD:feat/pet-ux-polish-v9
          fi
