name: pet-motion-v7
on:
  push:
    branches:
      - feat/pet-motion-expressions
    paths:
      - scripts/apply_pet_motion_v7.js
      - .github/workflows/pet-motion-v7.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pet-motion-expressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pet motion and expressions
        run: node scripts/apply_pet_motion_v7.js
      - name: Syntax checks
        run: |
          node --check app.js
          node --check content.js
          node --check welcome.js
          node --check sw.js
      - name: Regression tests
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/v7_motion_expression_smoke.js
          node tests/brand_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
      - name: Verify live motion implementation
        run: |
          grep -n 'petBlinkAlive' styles.css
          grep -n 'expression-happy' app.js
          grep -n 'pet-eyes' app.js
          grep -n 'pet-tail' app.js
          grep -n 'screenEnterAlive' styles.css
          grep -n 'app.js?v=20260917c' index.html
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css sw.js index.html tests/v7_motion_expression_smoke.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add live pet motion and state expressions"
            git push origin HEAD:feat/pet-motion-expressions
          fi
