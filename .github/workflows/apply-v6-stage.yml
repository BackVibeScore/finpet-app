name: apply-v6-stage
on:
  push:
    branches:
      - feat/difficulty-motion-parent-gate
    paths:
      - scripts/apply_v6_stage.js
      - scripts/v6_override.inc
      - tests/runtime_smoke.js
      - .github/workflows/apply-v6-stage.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/difficulty-motion-parent-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v6 patch
        run: node -e 'global.oldAge="${oldAge}"; require("./scripts/apply_v6_stage.js")'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check content.js
          node --check welcome.js
          node --check sw.js
      - name: Regression tests
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
          node tests/simulate_strategies.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js welcome.js welcome.css styles.css sw.js tests/v5_requirements_smoke.js tests/side_job_smoke.js tests/v6_requirements_smoke.js CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Apply v6 difficulty, motion, UX and parent gate"
            git push origin HEAD:feat/difficulty-motion-parent-gate
          fi
