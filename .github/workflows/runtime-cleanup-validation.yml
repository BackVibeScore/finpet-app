name: Runtime cleanup validation

on:
  push:
    branches:
      - chore/flatten-runtime-clean-css

permissions:
  contents: write

jobs:
  clean-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary parsers
        run: npm install --no-save --package-lock=false acorn postcss postcss-selector-parser
      - name: Flatten shadowed runtime and remove dead CSS selectors
        run: |
          node <<'NODE'
          const fs=require('fs');
          const acorn=require('acorn');
          const postcss=require('postcss');
          const selectorParser=require('postcss-selector-parser');

          let app=fs.readFileSync('app.js','utf8');
          const ast=acorn.parse(app,{ecmaVersion:'latest',sourceType:'script'});

          let iifeBody=null;
          const visit=node=>{
            if(!node||typeof node!=='object'||iifeBody) return;
            if(node.type==='ArrowFunctionExpression'&&node.body?.type==='BlockStatement'){
              const names=node.body.body.filter(x=>x.type==='FunctionDeclaration'&&x.id).map(x=>x.id.name);
              if(names.includes('freshState')&&names.includes('render')){ iifeBody=node.body; return; }
            }
            for(const value of Object.values(node)){
              if(Array.isArray(value)){ for(const item of value) visit(item); }
              else if(value&&typeof value==='object'&&value.type) visit(value);
              if(iifeBody) return;
            }
          };
          visit(ast);
          if(!iifeBody) throw new Error('Application IIFE body not found');

          const funcs=iifeBody.body.filter(x=>x.type==='FunctionDeclaration'&&x.id);
          const lastByName=new Map();
          funcs.forEach(fn=>lastByName.set(fn.id.name,fn));
          const remove=funcs.filter(fn=>lastByName.get(fn.id.name)!==fn).sort((a,b)=>b.start-a.start);

          for(const fn of remove){
            let start=fn.start, end=fn.end;
            while(start>0&&app[start-1]===' ') start--;
            if(start>0&&app[start-1]==='\n') start--;
            while(end<app.length&&(app[end]===' '||app[end]==='\t')) end++;
            if(app[end]==='\r') end++;
            if(app[end]==='\n') end++;
            app=app.slice(0,start)+app.slice(end);
          }

          app=app.replace(/^\s*\/\/ ===== (?:V3 CUSTDEV GAME-DEPTH OVERRIDES|V5 AGE, GUIDANCE, SAFETY AND CONFIRMATION OVERRIDES|V6 DIFFICULTY, MOTION, CHILD UX AND PARENT GATE OVERRIDES|END V6 OVERRIDES|END V5 OVERRIDES|END V3 OVERRIDES) =====\s*\r?\n/gm,'');
          app=app.replace(/\n{4,}/g,'\n\n\n');
          fs.writeFileSync('app.js',app);

          const css=fs.readFileSync('styles.css','utf8');
          const root=postcss.parse(css);
          const dead=new Set(['age-7-11','age-15-17','difficulty-settings','adult-hold','adult-hold-progress','parent-puzzle','parent-puzzle-screen','parent-puzzle-progress']);

          root.walkRules(rule=>{
            if(!rule.selector) return;
            const keep=[];
            selectorParser(selectors=>{
              selectors.each(sel=>{
                let isDead=false;
                sel.walkClasses(cls=>{ if(dead.has(cls.value)) isDead=true; });
                if(!isDead) keep.push(sel.toString());
              });
            }).processSync(rule.selector);
            if(keep.length) rule.selector=keep.join(',');
            else rule.remove();
          });
          root.walkAtRules(at=>{
            if(/keyframes$/i.test(at.name)&&at.params.trim()==='adultHold') at.remove();
          });
          fs.writeFileSync('styles.css',root.toString());

          console.log('Removed shadowed function declarations:',remove.length);
          NODE
      - name: Syntax checks
        run: |
          node --check app.js
          node --check content.js
          node --check welcome.js
          node --check sw.js
      - name: Regression suite
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/v7_motion_expression_smoke.js
          node tests/v8_motion_toggle_runtime_smoke.js
          node tests/v9_pet_ux_smoke.js
          node tests/v10_premium_onboarding_smoke.js
          node tests/brand_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
          node tests/repo_hygiene_smoke.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
          else
            git commit -m "Flatten runtime overrides and remove dead CSS"
            git push
          fi
