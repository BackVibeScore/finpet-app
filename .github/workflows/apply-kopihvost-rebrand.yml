name: apply-kopihvost-rebrand
on:
  push:
    branches:
      - feat/rebrand-kopihvost
    paths:
      - scripts/apply_kopihvost_rebrand.js
      - .github/workflows/apply-kopihvost-rebrand.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rebrand-kopihvost
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply brand changes
        run: node scripts/apply_kopihvost_rebrand.js
      - name: Syntax checks
        run: |
          node --check app.js
          node --check content.js
          node --check welcome.js
          node --check sw.js
          node --check scripts/build-standalone.js
      - name: Regression tests
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/brand_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
          node tests/simulate_strategies.js
      - name: Verify old brand is absent from runtime
        run: |
          if grep -nE 'ФинПитомец|Фин Питомец|финпитомец|FINПитомец|FinPet|Fin Pet' app.js welcome.js index.html manifest.json; then
            echo 'Old brand remains in runtime files' >&2
            exit 1
          fi
          grep -n 'finpet_mvp_state_v1' app.js welcome.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js welcome.js index.html manifest.json sw.js scripts/build-standalone.js README.md TEST_REPORT.md CHANGELOG.md STORE_METADATA.md tests/brand_smoke.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Rebrand user-facing product to KopiKhvost"
            git push origin HEAD:feat/rebrand-kopihvost
          fi
