name: fix-motion-runtime
on:
  push:
    branches:
      - fix/motion-settings-runtime
    paths:
      - scripts/fix_motion_runtime.js
      - .github/workflows/fix-motion-runtime.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/motion-settings-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime motion fixes
        run: node scripts/fix_motion_runtime.js
      - name: Syntax checks
        run: |
          node --check app.js
          node --check content.js
          node --check welcome.js
          node --check sw.js
      - name: Regression tests
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/brand_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
      - name: Verify motion UI and cache strategy
        run: |
          grep -n 'Анимация интерфейса' app.js
          grep -n 'data-toggle="motion"' app.js
          grep -n 'updateViaCache' app.js
          grep -n 'motion-runtime-20260917b' sw.js
          grep -n "cache:'no-store'" sw.js
          grep -n 'app.js?v=20260917b' index.html
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css sw.js index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Fix visible motion controls and stale runtime cache"
            git push origin HEAD:fix/motion-settings-runtime
          fi
