name: Validate HQ onboarding

on:
  push:
    branches: [fix/hq-onboarding-layout]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke and regression tests
        run: |
          set -e
          for f in tests/*.js; do
            case "$f" in
              *visual_mobile_check.js|*simulate_strategies.js) continue ;;
            esac
            echo "==> $f"
            node "$f"
          done
