name: fix-motion-toggle-v8
on:
  push:
    branches:
      - fix/motion-toggle-runtime-v8
    paths:
      - scripts/fix_motion_toggle_v8.js
      - .github/workflows/fix-motion-toggle-v8.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/motion-toggle-runtime-v8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply motion runtime fix
        run: node scripts/fix_motion_toggle_v8.js
      - name: Syntax checks
        run: |
          node --check app.js
          node --check content.js
          node --check welcome.js
          node --check sw.js
      - name: Regression tests
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/v7_motion_expression_smoke.js
          node tests/v8_motion_toggle_runtime_smoke.js
          node tests/brand_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
      - name: Commit verified runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix_motion_toggle_v8.js .github/workflows/fix-motion-toggle-v8.yml
          git add app.js styles.css welcome.css index.html sw.js tests/v8_motion_toggle_runtime_smoke.js
          git commit -m "Fix animation toggle runtime behavior"
          git push origin HEAD:fix/motion-toggle-runtime-v8
