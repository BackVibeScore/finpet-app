name: fix-v7-motion-off
on:
  push:
    branches:
      - feat/pet-motion-expressions
    paths:
      - scripts/fix_v7_motion_off.js
      - .github/workflows/fix-v7-motion-off.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pet-motion-expressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden motion off
        run: node scripts/fix_v7_motion_off.js
      - name: Syntax checks
        run: |
          node --check app.js
          node --check sw.js
      - name: Regression tests
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/v7_motion_expression_smoke.js
          node tests/brand_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css tests/v7_motion_expression_smoke.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Harden animation disable behavior"
            git push origin HEAD:feat/pet-motion-expressions
          fi
