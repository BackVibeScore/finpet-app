name: brand-audit
on:
  push:
    branches:
      - feat/rebrand-kopihvost
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find old brand references
        run: |
          echo '=== OLD BRAND / TECHNICAL REFERENCES ==='
          grep -RInE 'ФинПитомец|Фин Питомец|финпитомец|FINПитомец|FinPet|Fin Pet|finpet' --exclude-dir=.git . || true
