name: harden-v9-motion-on
on:
  push:
    branches:
      - feat/pet-ux-polish-v9
    paths:
      - scripts/harden_v9_motion_on.js
      - .github/workflows/harden-v9-motion-on.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pet-ux-polish-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden V9 motion on
        run: node scripts/harden_v9_motion_on.js
      - name: Syntax checks
        run: node --check app.js
      - name: Regression tests
        run: |
          node tests/runtime_smoke.js
          node tests/gameplay_smoke.js
          node tests/side_job_smoke.js
          node tests/v5_requirements_smoke.js
          node tests/v6_requirements_smoke.js
          node tests/v7_motion_expression_smoke.js
          node tests/v8_motion_toggle_runtime_smoke.js
          node tests/v9_pet_ux_smoke.js
          node tests/brand_smoke.js
          node tests/validate_content.js
          node tests/validate_analytics.js
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css tests/v9_pet_ux_smoke.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Ensure V9 pet micro-motion follows app setting"
            git push origin HEAD:feat/pet-ux-polish-v9
          fi
